connect:
  name: Connect
  description: Press the configured SwitchBot and open a Bluetooth session.
  fields:
    config_entry_id:
      name: Printer configuration
      required: true
      selector:
        config_entry:
          integration: fichero_printer
disconnect:
  name: Disconnect
  description: Close Bluetooth and optionally press the configured SwitchBot to power off.
  fields:
    config_entry_id:
      name: Printer configuration
      required: true
      selector:
        config_entry:
          integration: fichero_printer
print_label:
  name: Print label
  description: Automatically fit text and print one or more labels, connecting first when needed.
  fields:
    config_entry_id:
      name: Printer configuration
      required: true
      selector:
        config_entry:
          integration: fichero_printer
    text:
      name: Text
      description: Printed bold above the date; may be empty when a date is given.
      selector:
        text:
          multiline: true
    date:
      name: Date
      description: Printed in a smaller font on its own line under the text.
      selector:
        text:
    icon:
      name: Icon
      description: Material Design Icons name printed next to the text.
      selector:
        icon:
    artwork:
      name: Artwork
      description: Base64 PNG printed instead of the pictogram, or on its own in full mode.
      selector:
        text:
    artwork_mode:
      name: Artwork mode
      description: Whether the picture replaces the pictogram or fills the whole label.
      default: icon
      selector:
        select:
          options:
            - icon
            - full
    icon_side:
      name: Icon side
      description: Which end of the label the pictogram is printed on.
      default: left
      selector:
        select:
          options:
            - left
            - right
    copies:
      name: Copies
      default: 1
      selector:
        number:
          min: 1
          max: 100
          mode: box
    margin_mm:
      name: Margin (mm)
      description: Blank border kept on every side of the label.
      default: 1
      selector:
        number:
          min: 0
          max: 5
          step: 0.5
          mode: box
    offset_mm:
      name: Offset (mm)
      description: Shifts the text along the label; positive moves it to the right as the label is read.
      default: 0
      selector:
        number:
          min: -10
          max: 10
          step: 0.5
          mode: box
    bold:
      name: Bold
      description: Prints the text and the date in the bold face; leave it on unless the label needs a lighter look.
      default: true
      selector:
        boolean:
    length_mm:
      name: Label length (mm)
      description: Prints on a tape of a different length than the one configured for this printer.
      selector:
        number:
          min: 10
          max: 100
          step: 1
          mode: box
save_favorite:
  name: Save favorite
  description: Save label text as a shortcut on the dashboard card.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: fichero_printer
    text:
      required: true
      selector:
        text:
delete_favorite:
  name: Delete favorite
  description: Remove a saved label shortcut.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: fichero_printer
    index:
      name: Favorite position
      description: Zero-based position used by the dashboard card.
      required: false
      selector:
        number:
          min: 0
          mode: box
    text:
      name: Favorite text
      description: Text value retained for existing automations.
      required: false
      selector:
        text:
